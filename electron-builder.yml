appId: com.math-prevaris.flussi
productName: Flussi
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# Pas de recompilation des modules natifs : @electron/rebuild ne reconnaît pas les binaires
# précompilés de @primno/dpapi (prebuilds/win32-x64/@primno+dpapi.node) ni de koffi (binaires dans
# @koromix/koffi-win32-x64) et lancerait une compilation node-gyp. Sans risque pour des modules
# N-API (stables d'une version d'Electron à l'autre).
# À revoir avant toute nouvelle dépendance native (ssh2 en v0.5.0).
npmRebuild: false
win:
  target:
    - nsis
# Installation par machine, silencieuse avec /S (déploiement Intune en application Win32)
nsis:
  oneClick: true
  perMachine: true
  artifactName: ${productName}-${version}-setup.${ext}
  # Crée %ProgramData%\Flussi avec ses droits (administrateurs en écriture, utilisateurs en lecture)
  include: build/installer.nsh
# Mises à jour poussées par Intune : pas de publication ni d'electron-updater
publish: null
